<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Restock board</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%98%95%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
:root{
  --bg:#E7EDF0; --card:#FFFFFF; --ink:#142A3A; --muted:#4F636D; --line:#C3CFD5;
  --today:#C93A1E; --soon:#1D6E8C; --making:#8A5A00; --making-bg:#FFE6A8; --done:#25703F;
  --btn:#142A3A; --btn-ink:#FFFFFF; --on-accent:#FFFFFF; --shadow:#B4C3CB;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1C25; --card:#182833; --ink:#E8F0F3; --muted:#9DB0BA; --line:#2C414E;
    --today:#FF8466; --soon:#5BBBD9; --making:#F0B73E; --making-bg:#3A2E0C; --done:#5FC48A;
    --btn:#E8F0F3; --btn-ink:#0F1C25; --on-accent:#0F1C25; --shadow:#0A141A;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1C25; --card:#182833; --ink:#E8F0F3; --muted:#9DB0BA; --line:#2C414E;
  --today:#FF8466; --soon:#5BBBD9; --making:#F0B73E; --making-bg:#3A2E0C; --done:#5FC48A;
  --btn:#E8F0F3; --btn-ink:#0F1C25; --on-accent:#0F1C25; --shadow:#0A141A;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.45;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--soon);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1}
.wrap{max-width:1100px;margin:0 auto;padding:16px 16px 48px}

/* top bar */
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:20px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:26px}
.live{font-family:var(--body);font-weight:400;font-size:15px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--done)}
.dot.off{background:var(--today)}

/* sections */
.who{display:flex;align-items:center;gap:10px;font-weight:700;flex-wrap:wrap}
.login{max-width:560px;margin:8px auto 24px}
.roles{border:0;padding:0;margin:0;display:grid;gap:10px}
.roles legend{font-weight:700;margin-bottom:8px;padding:0}
.roles label{display:block}
.roles input{position:absolute;opacity:0;pointer-events:none}
.roles span{display:block;border:2px solid var(--ink);border-radius:14px;padding:14px 16px;min-height:64px}
.roles span b{display:block;font-family:var(--display);font-size:24px}
.roles input:checked + span{background:var(--btn);color:var(--btn-ink)}
.roles input:focus-visible + span{outline:3px solid var(--soon);outline-offset:2px}
.sec{margin:28px 0 12px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec h2{font-size:28px;font-weight:800}
.count{color:var(--muted);font-size:17px}
.tools{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.chip{border:2px solid var(--ink);background:transparent;border-radius:999px;padding:8px 16px;min-height:44px;font-weight:700}
.chip[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}

/* kitchen tickets */
.ticket{background:var(--card);border:2px solid var(--ink);border-radius:6px 6px 18px 18px;box-shadow:5px 5px 0 var(--shadow);position:relative;overflow:hidden;display:flex;flex-direction:column}
.ticket::before{content:"";height:12px;background:var(--soon)}
.ticket.u-today::before{background:var(--today)}
.t-head{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:12px 16px 10px;border-bottom:2px dashed var(--line);font-size:15px;color:var(--muted)}
.tag{background:var(--soon);color:var(--on-accent);font-weight:700;font-size:15px;border-radius:999px;padding:3px 12px}
.u-today .tag{background:var(--today)}
.t-body{padding:14px 16px 6px}
.t-body h3{font-size:34px;font-weight:800;overflow-wrap:anywhere}
.qty{margin:8px 0 0;font-size:20px}
.qty b{font-family:var(--display);font-size:56px;font-weight:800;line-height:1;margin-right:8px}
.note{margin:10px 0 0;padding:8px 12px;border-left:5px solid var(--line);color:var(--muted);overflow-wrap:anywhere}
.t-foot{padding:14px 16px 16px;display:flex;gap:10px;flex-wrap:wrap}
.big{flex:1 1 auto;min-height:64px;border:0;border-radius:12px;background:var(--btn);color:var(--btn-ink);font-weight:700;font-size:21px;padding:10px 20px}
.big.go{background:var(--done);color:#fff}
.ghost{min-height:64px;border:2px solid var(--ink);background:transparent;border-radius:12px;font-weight:700;padding:10px 18px}
.making-flag{background:var(--making-bg);color:var(--making);font-weight:700;padding:8px 16px;border-bottom:2px dashed var(--line)}
.ticket.fresh{animation:pulse 1.2s ease-in-out 3}
@keyframes pulse{50%{box-shadow:0 0 0 6px var(--today)}}
.empty{background:var(--card);border:2px dashed var(--line);border-radius:18px;padding:28px 20px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-family:var(--display);font-size:24px;margin-bottom:4px}

/* shop */
.rows{display:grid;gap:10px}
.row{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.row .nm{flex:1 1 180px;font-weight:700;overflow-wrap:anywhere}
.row .nm small{display:block;font-weight:400;color:var(--muted)}
.pill{font-weight:700;font-size:15px;border-radius:999px;padding:4px 12px;background:var(--line);color:var(--ink)}
.pill.making{background:var(--making-bg);color:var(--making)}
.pill.sent{background:var(--done);color:var(--on-accent)}
.small{min-height:48px;border:2px solid var(--ink);background:transparent;border-radius:10px;padding:6px 16px;font-weight:700}
.small.solid{background:var(--btn);color:var(--btn-ink)}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.item{position:relative;min-height:84px;text-align:left;background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:12px 14px;font-weight:700;display:flex;flex-direction:column;justify-content:center;overflow-wrap:anywhere}
.item small{font-weight:400;color:var(--muted)}
.items.edit .item{padding-right:56px}
.x{position:absolute;top:6px;right:6px;width:44px;height:44px;border-radius:50%;border:2px solid var(--today);color:var(--today);background:var(--card);font-size:22px;line-height:1;display:grid;place-items:center}
.sub{margin:18px 0 8px;font-size:20px;font-weight:800;font-family:var(--display)}

/* selection tiles + tray */
.item.sel{border-width:3px;border-color:var(--soon);gap:8px}
.iname{overflow-wrap:anywhere}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:6px}
.stepper button{width:48px;height:48px;border-radius:12px;border:2px solid var(--ink);background:transparent;font-size:26px;font-weight:700;line-height:1}
.stepper b{font-family:var(--display);font-size:30px;font-weight:800}
.sel-card{border-color:var(--soon);border-width:3px}
.tray-head{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:20px}
.link{border:0;background:transparent;text-decoration:underline;font-weight:700;min-height:44px;padding:0 6px}
.lines{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.lines li{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dashed var(--line);padding:4px 0}
.when{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.when button{min-height:52px;border:2px solid var(--ink);background:transparent;border-radius:12px;font-weight:700}
.when button[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink)}
input[type=text],select{font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:12px;min-height:52px;width:100%}
label.f{display:grid;gap:6px;font-weight:700}
.panel{background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:16px;margin-bottom:16px;display:grid;gap:12px}
.panel h2{font-size:26px;font-weight:800}
.acts{display:flex;gap:10px}
.acts .big,.acts .ghost{min-height:58px}

.notice{background:var(--card);border:2px solid var(--today);border-radius:14px;padding:14px 16px;margin-bottom:16px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--btn);color:var(--btn-ink);padding:12px 20px;border-radius:12px;font-weight:700;z-index:50;max-width:calc(100% - 32px)}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){.ticket.fresh{animation:none;outline:4px solid var(--today)}}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}
.pill.off{background:var(--today);color:var(--on-accent)}
select.sm{min-height:48px;width:auto;padding:6px 10px}
.hint{color:var(--muted);margin:0 0 12px}
</style>
</head>
<body>
<div class="wrap">
  <header class="bar">
    <div class="brand"><span aria-hidden="true">☕</span> Restock board <span class="live" id="live"></span></div>
    <div class="who" id="who" hidden>
      <span id="whoName"></span>
      <button type="button" class="chip" id="pwBtn" data-act="pw-open">Password</button>
      <button type="button" class="chip" data-act="logout">Sign out</button>
    </div>
  </header>
  <div id="notice"></div>
  <div class="tabs" id="adminTabs" hidden></div>

  <section class="panel login" id="login" hidden>
    <h2>Sign in</h2>
    <p class="count" id="lMsg" style="margin:0;font-weight:700" aria-live="polite"></p>
    <div id="lDemo" hidden style="display:grid;gap:12px">
      <label class="f">Your name <input id="lName" type="text" maxlength="30" placeholder="e.g. Mia" autocomplete="given-name"></label>
      <fieldset class="roles" id="lRoles">
        <legend>Where are you working?</legend>
        <label><input type="radio" name="lrole" value="shop"><span><b>Shop</b>Ask the kitchen for pastries and ingredients</span></label>
        <label><input type="radio" name="lrole" value="kitchen"><span><b>Kitchen</b>See what to make and hear an alert for new requests</span></label>
        <label><input type="radio" name="lrole" value="admin"><span><b>Admin</b>People, order history and connection</span></label>
      </fieldset>
      <button type="button" class="big" data-act="login-demo">Open</button>
    </div>
    <div id="lCloud" hidden style="display:grid;gap:12px">
      <label class="f">Username <input id="lUser" type="text" maxlength="40" autocomplete="username" autocapitalize="off" autocorrect="off"></label>
      <label class="f">Password <input id="lPass" type="password" maxlength="60" autocomplete="current-password"></label>
      <button type="button" class="big" data-act="login-cloud">Sign in</button>
      <button type="button" class="link" data-act="setup-toggle" style="justify-self:start">First-time setup (owner only)</button>
    </div>
    <div id="lSetup" hidden style="display:grid;gap:12px">
      <p style="margin:0">Create the first admin account. This only works while no admin exists yet.</p>
      <label class="f">Your name <input id="sName" type="text" maxlength="30" placeholder="e.g. Mark"></label>
      <label class="f">Username <input id="sUser" type="text" maxlength="40" autocapitalize="off" autocorrect="off" placeholder="e.g. mark"></label>
      <label class="f">Password (at least 6 characters) <input id="sPass" type="password" maxlength="60" autocomplete="new-password"></label>
      <button type="button" class="big" data-act="setup-admin">Create admin account</button>
      <button type="button" class="link" data-act="setup-toggle" style="justify-self:start">Back to sign in</button>
    </div>
  </section>

  <section class="panel" id="addPanel" hidden>
    <h2>Add an item</h2>
    <label class="f">Name <input id="aName" type="text" maxlength="60" placeholder="e.g. Hazelnut syrup"></label>
    <label class="f">Type <select id="aKind"><option value="pastry">Pastry</option><option value="ingredient">Ingredient</option></select></label>
    <label class="f">Counted in <input id="aUnit" type="text" maxlength="20" value="pcs" placeholder="pcs, kg, bottles, trays"></label>
    <div class="acts"><button type="button" class="ghost" data-act="add-close">Cancel</button><button type="button" class="big" data-act="add-save">Save item</button></div>
  </section>

  <input type="file" id="fileIn" accept=".csv,text/csv,text/plain" hidden>
  <section class="panel" id="ioPanel" hidden>
    <h2 id="ioTitle">Result</h2>
    <pre id="ioText" style="white-space:pre-wrap;margin:0;font-family:var(--body)"></pre>
    <button type="button" class="ghost" data-act="io-close">Close</button>
  </section>

  <section class="panel" id="userPanel" hidden>
    <h2>Add a person</h2>
    <label class="f">Name <input id="uName" type="text" maxlength="30" placeholder="e.g. Mom"></label>
    <label class="f">Username <input id="uUser" type="text" maxlength="40" autocapitalize="off" autocorrect="off" placeholder="e.g. mom"></label>
    <label class="f">Password (at least 6 characters) <input id="uPass" type="text" maxlength="60" autocapitalize="off" autocorrect="off" placeholder="you choose it and tell them"></label>
    <label class="f">Access <select id="uRole"><option value="shop">Shop</option><option value="kitchen">Kitchen</option><option value="admin">Admin</option></select></label>
    <button type="button" class="big" data-act="adm-add">Add person</button>
  </section>

  <section class="panel" id="pwPanel" hidden>
    <h2>Change my password</h2>
    <label class="f">New password (at least 6 characters) <input id="pNew" type="password" maxlength="60" autocomplete="new-password"></label>
    <div class="acts"><button type="button" class="ghost" data-act="pw-close">Cancel</button><button type="button" class="big" data-act="pw-save">Save password</button></div>
  </section>

  <section class="panel" id="connPanel" hidden>
    <h2>Connection</h2>
    <p class="count" id="cStatus" style="margin:0"></p>
    <label class="f">Database URL <input id="cDb" type="text" placeholder="https://your-project-default-rtdb.firebaseio.com" autocapitalize="off" autocorrect="off"></label>
    <label class="f">Web API key <input id="cKey" type="text" placeholder="starts with AIza…" autocapitalize="off" autocorrect="off"></label>
    <div class="acts"><button type="button" class="ghost" data-act="conn-test">Test connection</button><button type="button" class="big" data-act="conn-save">Save and connect</button></div>
    <p id="cResult" style="margin:0;font-weight:700" aria-live="polite"></p>
    <label class="f">Link to share with your family <input id="cLink" type="text" readonly></label>
    <div class="acts"><button type="button" class="ghost" data-act="conn-copy">Copy link</button><button type="button" class="ghost" data-act="conn-close">Close</button></div>
    <button type="button" class="link" data-act="conn-demo" style="justify-self:start">Disconnect this device (demo mode)</button>
  </section>

  <main id="app" aria-live="polite"></main>
</div>
<div class="toast" id="toast" hidden></div>
<script>
(function(){
  var $ = function(s){ return document.querySelector(s); };
  var esc = function(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };

  /* Optional: paste your Firebase Realtime Database URL and Web API key here instead of using
     the share link from the Admin > Connection tab. Neither value is a password, but only
     people with an approved account can read or change any data (see the database rules). */
  var CONFIG = { databaseUrl: '', apiKey: '' };

  var STARTER = [
    ['Croissant','pastry','pcs'],['Banana bread','pastry','loaves'],['Cinnamon roll','pastry','pcs'],
    ['Chocolate chip cookie','pastry','pcs'],['Brownie','pastry','pcs'],['Blueberry muffin','pastry','pcs'],
    ['Caramel syrup','ingredient','bottles'],['Vanilla syrup','ingredient','bottles'],['Chocolate sauce','ingredient','bottles'],
    ['Cold brew concentrate','ingredient','liters'],['Pastry cream','ingredient','kg'],['Cookie dough','ingredient','kg']
  ];
  var STATUS_LABEL = { requested:'Waiting', making:'Being made', sent:'On the way', received:'Received' };

  var state = { items:[], requests:[], history:[], historyEnd:false, users:{}, user:null, role:'', adminTab:'people',
                mode:'demo', connected:false, syncErr:'', me:'', soundOn:false, showDone:false, editList:false,
                fresh:{}, cart:{}, urgency:'today', note:'', addOpen:false, connOpen:false, pwOpen:false, setupOpen:false, loginMsg:'', ioTitle:'', ioText:'', importKind:'' };
  var audio = null, busy = {}, backend = null;
  try { state.soundOn = localStorage.getItem('rb-sound') === '1'; } catch(e){}

  /* ---------- helpers ---------- */
  function toast(msg){
    var t = $('#toast'); t.textContent = msg; t.hidden = false;
    clearTimeout(toast._t); toast._t = setTimeout(function(){ t.hidden = true; }, 3600);
  }
  function ago(ts){
    var m = Math.round((Date.now() - (ts || 0)) / 60000);
    if (m < 1) return 'just now';
    if (m < 60) return m + ' min ago';
    var h = Math.round(m / 60);
    if (h < 24) return h + ' h ago';
    return Math.round(h / 24) + ' d ago';
  }
  function when(ts){ try { return new Date(ts).toLocaleString([], { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' }); } catch(e){ return ''; } }
  function nameOf(by){ return !by ? 'Someone' : (by === state.me ? 'you' : by); }
  function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40) || 'item'; }
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function byAge(a,b){ return (a.createdAt||0) - (b.createdAt||0); }
  function lastName(){ try { return localStorage.getItem('rb-name') || ''; } catch(e){ return ''; } }
  function roleLabel(r){ return r === 'admin' ? 'Admin' : (r === 'kitchen' ? 'Kitchen' : 'Shop'); }
  function normUser(u){ return String(u || '').trim().toLowerCase().replace(/[^a-z0-9._-]/g, ''); }
  function toEmail(u){ var t = String(u || '').trim().toLowerCase(); return t.indexOf('@') > 0 ? t : normUser(t) + '@restock.invalid'; }

  function friendly(e){
    var c = (e && e.code) || '', m = (e && e.message) || '';
    var map = {
      EMAIL_EXISTS:'That username is already taken.', INVALID_LOGIN_CREDENTIALS:'Wrong username or password.', INVALID_PASSWORD:'Wrong username or password.',
      EMAIL_NOT_FOUND:'Wrong username or password.', USER_DISABLED:'This account has been disabled.', WEAK_PASSWORD:'The password needs at least 6 characters.',
      OPERATION_NOT_ALLOWED:'Email/password sign-in is not turned on in Firebase (Authentication > Sign-in method).',
      TOO_MANY_ATTEMPTS_TRY_LATER:'Too many attempts. Wait a few minutes and try again.', INVALID_EMAIL:'That username has characters that are not allowed.',
      CREDENTIAL_TOO_OLD_LOGIN_AGAIN:'For safety, sign out and sign in again, then change the password.',
      TOKEN_EXPIRED:'Your session expired. Please sign in again.', INVALID_REFRESH_TOKEN:'Your session expired. Please sign in again.'
    };
    if (map[c]) return map[c];
    if (/API key/i.test(m)) return 'The Web API key was not accepted. Check it in Admin > Connection.';
    if (/Failed to fetch|NetworkError/i.test(m)) return 'Could not reach the server. Check the internet connection.';
    if (/permission denied|HTTP 401|HTTP 403/i.test(m)) return 'The database refused this. Your access may have been turned off, or the database rules are not published.';
    return m || 'Something went wrong.';
  }

  /* ---------- connection settings ---------- */
  function cfg(){
    var p = null; try { p = new URLSearchParams(location.search); } catch(e){}
    var d = p && p.get('db'), k = p && p.get('key');
    if (d && k) { try { localStorage.setItem('rb-cfg', JSON.stringify({ db:d, key:k })); } catch(e){} return { db:d, key:k }; }
    try { var st = JSON.parse(localStorage.getItem('rb-cfg') || 'null'); if (st && st.db && st.key) return st; } catch(e){}
    if (CONFIG.databaseUrl && CONFIG.apiKey) return { db:CONFIG.databaseUrl, key:CONFIG.apiKey };
    return null;
  }
  function pageBase(){ return location.href.split('#')[0].split('?')[0]; }
  function shareLink(db, key){
    if (!db || !key) return '';
    return pageBase() + '?db=' + encodeURIComponent(db.trim()) + '&key=' + encodeURIComponent(key.trim());
  }
  function normDb(raw){
    var t = String(raw || '').trim().replace(/^["']+|["']+$/g, '');
    if (!t) return { ok:false, msg:'Paste the database URL first.' };
    if (!/^https?:\/\//i.test(t)) t = 'https://' + t;
    var u; try { u = new URL(t); } catch(e){ return { ok:false, msg:'That does not look like a web address. Copy the database URL from the top of the Data tab in Firebase.' }; }
    var h = u.hostname.toLowerCase();
    if (/(^|\.)firebase\.google\.com$/.test(h))
      return { ok:false, msg:'That is the Firebase console address. You need the database URL instead: open Realtime Database, then the Data tab, and copy the address shown at the top. It ends in firebaseio.com or firebasedatabase.app.' };
    if (!/(\.firebaseio\.com|\.firebasedatabase\.app)$/.test(h) && !/^(localhost|127\.0\.0\.1)$/.test(h))
      return { ok:false, msg:'The database URL should end in firebaseio.com or firebasedatabase.app. Copy it from the top of the Data tab in Firebase Realtime Database.' };
    return { ok:true, url: u.origin, host: h };
  }
  async function testConn(dbRaw, keyRaw){
    var n = normDb(dbRaw); if (!n.ok) return n.msg;
    var key = String(keyRaw || '').trim(); if (!key) return 'Paste the Web API key first.';
    var framed = false; try { framed = window.top !== window.self; } catch(x){ framed = true; }
    try {
      var r1 = await fetch(n.url + '/ping.json');
      if (r1.status === 404) return 'The database address answered "not found" (HTTP 404). Check the URL, and make sure the Realtime Database has been created.';
    } catch(e){
      return 'Could not reach ' + n.host + '. Check the spelling of the URL (databases outside the US usually end in firebasedatabase.app), turn off any ad-blocker for this page, and make sure the page is opened directly in your browser' +
             (framed ? ' (it looks like it is being shown inside another app or preview, which can block outside connections).' : '.');
    }
    try {
      var r2 = await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=' + encodeURIComponent(key), {
        method:'POST', headers:{ 'Content-Type':'application/json' },
        body: JSON.stringify({ email:'connection-test@restock.invalid', password:'not-a-real-password', returnSecureToken:true }) });
      var j = await r2.json().catch(function(){ return {}; });
      var m = (j.error && (j.error.message || '')) || '';
      if (/API key/i.test(m) || /API_KEY/i.test(m)) return 'The Web API key was not accepted. Copy it again from Firebase Project settings.';
      if (/OPERATION_NOT_ALLOWED/.test(m)) return 'Email/password sign-in is not turned on. In Firebase open Authentication > Sign-in method and enable Email/Password.';
      return 'Connected \u2714 The database and the sign-in service are both reachable.';
    } catch(e){ return 'Could not reach the Google sign-in service. Check the internet connection or any ad-blocker.'; }
  }

  /* ---------- cloud backend: Firebase sign-in + Realtime Database over REST ---------- */
  function makeCloud(c){
    var n = normDb(c.db), base = n.ok ? n.url : String(c.db).trim().replace(/\/+$/, ''), key = String(c.key).trim();
    var S = { idToken:'', rt:'', uid:'', exp:0 };
    var cb = null, active = false, running = false, again = false, es = null, esTimer = null, timers = [], lastPing = null;

    function errOf(j, status){
      var m = (j && j.error && (j.error.message || j.error)) || '';
      var e = new Error(typeof m === 'string' && m ? m : ('HTTP ' + status));
      e.code = String(m).split(' ')[0]; e.status = status; return e;
    }
    function saveSession(){ try { localStorage.setItem('rb-session', JSON.stringify({ uid:S.uid, rt:S.rt, db:base })); } catch(e){} }
    function adopt(j){
      S.idToken = j.idToken || j.id_token; S.rt = j.refreshToken || j.refresh_token; S.uid = j.localId || j.user_id || S.uid;
      S.exp = Date.now() + (parseInt(j.expiresIn || j.expires_in, 10) || 3600) * 1000; saveSession();
    }
    async function idt(ep, body){
      var r = await fetch('https://identitytoolkit.googleapis.com/v1/accounts:' + ep + '?key=' + encodeURIComponent(key),
        { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify(body) });
      var j = await r.json().catch(function(){ return {}; });
      if (!r.ok) throw errOf(j, r.status);
      return j;
    }
    async function refresh(){
      var r = await fetch('https://securetoken.googleapis.com/v1/token?key=' + encodeURIComponent(key),
        { method:'POST', headers:{ 'Content-Type':'application/x-www-form-urlencoded' }, body:'grant_type=refresh_token&refresh_token=' + encodeURIComponent(S.rt) });
      var j = await r.json().catch(function(){ return {}; });
      if (!r.ok) throw errOf(j, r.status);
      adopt(j);
    }
    async function token(){ if (!S.idToken || Date.now() > S.exp - 120000) await refresh(); return S.idToken; }
    async function url(path, q){ var t = await token(); return base + '/' + path + '.json?auth=' + encodeURIComponent(t) + (q ? '&' + q : ''); }
    async function get(path, q){
      var r = await fetch(await url(path, q));
      if (!r.ok) { var e = new Error('HTTP ' + r.status); e.status = r.status; throw e; }
      return r.json();
    }
    function ping(){ url('ping').then(function(u){ return fetch(u, { method:'PUT', body:String(Date.now()) }); }).catch(function(){}); }
    var ORDER = 'orderBy=' + encodeURIComponent('"createdAt"');

    async function pull(){
      if (!active) return;
      if (running) { again = true; return; }
      running = true;
      try {
        var res = await Promise.all([ get('items'), get('requests', ORDER + '&limitToLast=100') ]);
        if (cb) cb({ items: res[0] || {}, requests: res[1] || {} }, null);
      } catch(e){ if (cb) cb(null, e); }
      running = false;
      if (again) { again = false; pull(); }
    }
    function closeStream(){ if (es) { try { es.close(); } catch(e){} es = null; } }
    async function openStream(){
      closeStream(); clearTimeout(esTimer);
      try {
        es = new EventSource(await url('ping'));
        es.addEventListener('put', function(){ pull(); });
        es.addEventListener('auth_revoked', function(){ if (active) openStream(); });
        es.onerror = function(){ closeStream(); clearTimeout(esTimer); esTimer = setTimeout(function(){ if (active) openStream(); }, 8000); };
      } catch(e){}
    }

    return {
      uid: function(){ return S.uid; },
      refresh: pull,
      subscribe: function(f){
        cb = f; active = true; lastPing = null; pull(); openStream();
        timers.push(setInterval(async function(){
          try { var v = await get('ping'); if (String(v) !== String(lastPing)) { lastPing = v; pull(); } }
          catch(e){ if (cb) cb(null, e); }
        }, 20000));
        timers.push(setInterval(pull, 300000));
        timers.push(setInterval(openStream, 45 * 60 * 1000));
      },
      stop: function(){ active = false; cb = null; timers.forEach(clearInterval); timers = []; closeStream(); clearTimeout(esTimer); },
      signOut: function(){ S = { idToken:'', rt:'', uid:'', exp:0 }; try { localStorage.removeItem('rb-session'); } catch(e){} },
      restore: async function(){
        var s = null; try { s = JSON.parse(localStorage.getItem('rb-session') || 'null'); } catch(e){}
        if (!s || s.db !== base || !s.rt) return false;
        S.rt = s.rt; S.uid = s.uid; await refresh(); return true;
      },
      signIn: async function(user, pw){ adopt(await idt('signInWithPassword', { email: toEmail(user), password: pw, returnSecureToken: true })); return S.uid; },
      signUpAdopt: async function(user, pw){ adopt(await idt('signUp', { email: toEmail(user), password: pw, returnSecureToken: true })); return S.uid; },
      signUpNew: async function(user, pw){ var j = await idt('signUp', { email: toEmail(user), password: pw, returnSecureToken: true }); return j.localId; },
      changePassword: async function(pw){ var t = await token(); adopt(await idt('update', { idToken: t, password: pw, returnSecureToken: true })); },
      getProfile: function(id){ return get('users/' + id); },
      getUsers: function(){ return get('users'); },
      getHistory: function(before, n){ return get('requests', ORDER + '&limitToLast=' + n + (before ? '&endAt=' + (before - 1) : '')); },
      send: async function(method, path, data){
        var r = await fetch(await url(path), { method: method, body: data === undefined ? undefined : JSON.stringify(data) });
        if (!r.ok) { var e = new Error(r.status === 401 ? 'permission denied' : 'HTTP ' + r.status); e.status = r.status; throw e; }
        if (/^(items|requests|users)/.test(path)) ping();
      }
    };
  }

  /* ---------- demo backend: this device only ---------- */
  function makeLocal(){
    var KEY = 'rb-demo-tree', mem = {}, cb = null, on = false, handler = null;
    function load(){ try { var v = localStorage.getItem(KEY); if (v) return JSON.parse(v) || {}; } catch(e){} return JSON.parse(JSON.stringify(mem)); }
    function save(t){ mem = t; try { localStorage.setItem(KEY, JSON.stringify(t)); } catch(e){} }
    function pull(){ if (on && cb) cb(load(), null); }
    return {
      uid: function(){ return 'demo'; },
      refresh: pull,
      subscribe: function(f){
        cb = f; on = true; pull();
        if (!handler) { handler = function(e){ if (e.key === KEY) pull(); }; window.addEventListener('storage', handler); }
      },
      stop: function(){ on = false; },
      signOut: function(){},
      getUsers: async function(){ return {}; },
      getHistory: async function(before, n){
        var rq = load().requests || {}, o = {};
        Object.keys(rq).map(function(id){ return Object.assign({}, rq[id], { id: id }); })
          .filter(function(r){ return !before || (r.createdAt || 0) < before; })
          .sort(function(a,b){ return (b.createdAt||0) - (a.createdAt||0); }).slice(0, n)
          .forEach(function(r){ o[r.id] = r; });
        return o;
      },
      send: async function(method, path, data){
        var t = load(), parts = path.split('/'), col = parts[0];
        t[col] = t[col] || {};
        if (parts.length === 1) { if (method === 'PATCH') Object.assign(t[col], data); }
        else if (method === 'PUT') t[col][parts[1]] = data;
        else if (method === 'PATCH') t[col][parts[1]] = Object.assign({}, t[col][parts[1]], data);
        else if (method === 'DELETE') delete t[col][parts[1]];
        save(t);
      }
    };
  }

  /* ---------- sound ---------- */
  function beep(){
    try {
      var AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      if (!audio) audio = new AC();
      if (audio.state === 'suspended') audio.resume();
      [660, 880, 660].forEach(function(f, i){
        var o = audio.createOscillator(), g = audio.createGain();
        o.frequency.value = f; o.connect(g); g.connect(audio.destination);
        var t = audio.currentTime + i * 0.22;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.3, t + 0.03);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
        o.start(t); o.stop(t + 0.21);
      });
    } catch(e){}
  }
  var ringMaster = null, ringTimer = null;
  /* rings for `sec` seconds: a repeating two-tone chime, scheduled ahead on the audio clock */
  function ring(sec){
    try {
      var AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      if (!audio) audio = new AC();
      if (audio.state === 'suspended') audio.resume();
      if (ringMaster) { try { ringMaster.disconnect(); } catch(e){} clearTimeout(ringTimer); }
      var master = audio.createGain(); master.connect(audio.destination); ringMaster = master;
      var start = audio.currentTime + 0.05, reps = Math.floor(sec / 0.625);
      for (var r = 0; r < reps; r++) {
        [880, 660].forEach(function(f, i){
          var o = audio.createOscillator(), g = audio.createGain();
          o.frequency.value = f; o.connect(g); g.connect(master);
          var t = start + r * 0.625 + i * 0.22;
          g.gain.setValueAtTime(0.0001, t);
          g.gain.exponentialRampToValueAtTime(0.4, t + 0.02);
          g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
          o.start(t); o.stop(t + 0.21);
        });
      }
      ringTimer = setTimeout(function(){ try { master.disconnect(); } catch(e){} if (ringMaster === master) ringMaster = null; }, sec * 1000 + 600);
    } catch(e){}
  }
  document.addEventListener('pointerdown', function(){
    if (!state.soundOn) return;
    try {
      var AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      if (!audio) audio = new AC();
      if (audio.state === 'suspended') audio.resume().then(function(){ paint(); });
    } catch(e){}
  });

  /* ---------- live data ---------- */
  var seen = {}, loaded = false;
  function applyTree(tree){
    tree = tree || {};
    var its = tree.items || {}, rq = tree.requests || {};
    state.items = Object.keys(its).map(function(id){ return Object.assign({}, its[id], { id: id }); });
    state.requests = Object.keys(rq).map(function(id){ return Object.assign({}, rq[id], { id: id }); })
      .sort(function(a,b){ return (b.createdAt||0) - (a.createdAt||0); }).slice(0, 100);
    Object.keys(state.cart).forEach(function(id){ if (!itemById(id)) delete state.cart[id]; });
    var incoming = false;
    state.requests.forEach(function(r){
      if (!loaded) { seen[r.id] = true; return; }
      if (!seen[r.id]) {
        seen[r.id] = true;
        if (r.status === 'requested') { state.fresh[r.id] = Date.now() + 20000; incoming = true; }
      }
    });
    loaded = true;
    if (incoming && state.role === 'kitchen' && state.soundOn) ring(5);
    paint();
  }
  function startData(){
    loaded = false; seen = {}; state.syncErr = ''; state.connected = false;
    backend.subscribe(function(tree, err){
      if (err) {
        if (/^(INVALID_REFRESH_TOKEN|TOKEN_EXPIRED|USER_NOT_FOUND|USER_DISABLED)$/.test(err.code || '') || err.status === 401 || err.status === 403) {
          doLogout('Your access was turned off or your session expired. Please sign in again.'); return;
        }
        state.connected = false; state.syncErr = err.message || 'error'; paint(); return;
      }
      state.connected = true; state.syncErr = '';
      applyTree(tree);
    });
  }

  /* ---------- CSV import / export ---------- */
  function csvParse(text){
    var rows = [], row = [], cur = '', q = false;
    text = String(text).replace(/^\uFEFF/, '');
    for (var i = 0; i < text.length; i++) {
      var ch = text[i];
      if (q) { if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
      else if (ch === '"') q = true;
      else if (ch === ',') { row.push(cur); cur = ''; }
      else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cur); cur = ''; if (row.length > 1 || row[0] !== '') rows.push(row); row = []; }
      else cur += ch;
    }
    if (cur !== '' || row.length) { row.push(cur); if (row.length > 1 || row[0] !== '') rows.push(row); }
    return rows;
  }
  function csvCell(v){
    var s = String(v == null ? '' : v);
    if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
    return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }
  function csvClean(s){ s = String(s == null ? '' : s).trim(); return /^'[=+\-@]/.test(s) ? s.slice(1) : s; }
  function toCsv(rows){ return rows.map(function(r){ return r.map(csvCell).join(','); }).join('\r\n') + '\r\n'; }
  function download(name, text){
    var blob = new Blob(['\uFEFF' + text], { type: 'text/csv;charset=utf-8' });
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 800);
  }
  function iso(ts){ try { return ts ? new Date(ts).toISOString() : ''; } catch(e){ return ''; } }
  function today(){ return new Date().toISOString().slice(0, 10); }
  function showResult(title, lines){ state.ioTitle = title; state.ioText = lines.join('\n'); paint(); try { $('#ioPanel').scrollIntoView({ block: 'nearest' }); } catch(e){} }
  function columns(head, names){
    var idx = {}; names.forEach(function(n){ idx[n] = head.indexOf(n); }); return idx;
  }

  async function exportUsers(){
    await loadUsers();
    var rows = [['name', 'username', 'access', 'active', 'created_at']];
    Object.keys(state.users).map(function(id){ return state.users[id]; })
      .sort(function(a,b){ return String(a.name).localeCompare(String(b.name)); })
      .forEach(function(p){ rows.push([p.name, p.username, p.role, p.active === true ? 'yes' : 'no', iso(p.createdAt)]); });
    download('restock-people-' + today() + '.csv', toCsv(rows));
    toast('Exported ' + (rows.length - 1) + ' people (passwords are never exported).');
  }
  async function exportHistory(){
    var all = [], before = 0;
    for (var page = 0; page < 200; page++) {
      var obj = (await backend.getHistory(before, 500)) || {};
      var arr = Object.keys(obj).map(function(id){ return Object.assign({}, obj[id], { id: id }); }).sort(function(a,b){ return (b.createdAt||0) - (a.createdAt||0); });
      if (!arr.length) break;
      all = all.concat(arr); before = arr[arr.length - 1].createdAt;
      if (arr.length < 500) break;
    }
    var rows = [['created_at', 'item', 'quantity', 'unit', 'urgency', 'status', 'requested_by', 'note', 'updated_at']];
    all.forEach(function(r){ rows.push([iso(r.createdAt), r.name, r.qty, r.unit, r.urgency, r.status, r.by, r.note, iso(r.updatedAt)]); });
    download('restock-order-history-' + today() + '.csv', toCsv(rows));
    toast('Exported ' + all.length + ' orders.');
  }
  async function importUsers(text){
    var rows = csvParse(text);
    if (rows.length < 2) return showResult('People import', ['The file has no data rows. Use the Template button to see the expected columns.']);
    var head = rows[0].map(function(h){ return String(h).trim().toLowerCase(); });
    var c = columns(head, ['name', 'username', 'password', 'access']);
    if (c.name < 0 || c.username < 0 || c.password < 0) return showResult('People import', ['The first row must name the columns: name, username, password, access.']);
    var data = rows.slice(1, 101), ok = 0, lines = [];
    if (rows.length - 1 > 100) lines.push('Only the first 100 rows were used.');
    for (var i = 0; i < data.length; i++) {
      var r = data[i], nm = csvClean(r[c.name]), un = normUser(csvClean(r[c.username])), pw = String(r[c.password] == null ? '' : r[c.password]).trim();
      var role = c.access >= 0 ? csvClean(r[c.access]).toLowerCase() : 'shop'; if (!role) role = 'shop';
      var label = 'Row ' + (i + 2) + (nm ? ' (' + nm + ')' : '');
      if (!nm || un.length < 3 || pw.length < 6 || ['shop','kitchen','admin'].indexOf(role) < 0) { lines.push(label + ': skipped. Needs a name, a username of 3+ letters or numbers, a password of 6+ characters, and access of shop, kitchen or admin.'); continue; }
      try {
        var nid = await backend.signUpNew(un, pw);
        await backend.send('PUT', 'users/' + nid, { name: nm, username: un, role: role, active: true, createdAt: Date.now() });
        ok++;
      } catch(e){ lines.push(label + ': skipped. ' + friendly(e)); }
    }
    lines.unshift('Added ' + ok + ' of ' + data.length + ' people.' + (ok ? ' Tell each person their username and password, then delete the file, because it contains passwords.' : ''));
    await loadUsers(); showResult('People import', lines);
  }
  async function importHistory(text){
    var rows = csvParse(text);
    if (rows.length < 2) return showResult('Order history import', ['The file has no data rows. Use the Template button to see the expected columns.']);
    var head = rows[0].map(function(h){ return String(h).trim().toLowerCase(); });
    var c = columns(head, ['created_at', 'item', 'quantity', 'unit', 'urgency', 'status', 'requested_by', 'note']);
    if (c.item < 0) return showResult('Order history import', ['The first row must name the columns. At minimum: item. Use the Template button for the full list.']);
    var data = rows.slice(1, 2001), batch = {}, count = 0, lines = [];
    if (rows.length - 1 > 2000) lines.push('Only the first 2000 rows were used.');
    function get(r, k){ return c[k] >= 0 ? csvClean(r[c[k]]) : ''; }
    for (var i = 0; i < data.length; i++) {
      var r = data[i], item = get(r, 'item');
      if (!item) { lines.push('Row ' + (i + 2) + ': skipped, no item.'); continue; }
      var created = get(r, 'created_at'), ts = created ? (/^\d{10,}$/.test(created) ? Number(created) : Date.parse(created)) : Date.now();
      if (!isFinite(ts)) { lines.push('Row ' + (i + 2) + ' (' + item + '): skipped, the date "' + created + '" is not understood. Use a format like 2026-10-11 14:30.'); continue; }
      var qty = parseInt(get(r, 'quantity'), 10); if (!isFinite(qty) || qty < 1) qty = 1; if (qty > 999) qty = 999;
      var urg = get(r, 'urgency').toLowerCase() === 'week' || /week/i.test(get(r, 'urgency')) ? 'week' : 'today';
      batch['imp' + uid() + i] = { itemId: '', name: item, unit: get(r, 'unit') || 'pcs', qty: qty, urgency: urg, note: get(r, 'note'),
                                   status: 'received', by: get(r, 'requested_by') || 'Imported', createdAt: ts, updatedAt: ts };
      count++;
    }
    var keys = Object.keys(batch);
    try {
      for (var k = 0; k < keys.length; k += 100) {
        var part = {}; keys.slice(k, k + 100).forEach(function(id){ part[id] = batch[id]; });
        await backend.send('PATCH', 'requests', part);
      }
    } catch(e){ lines.unshift('Stopped: ' + friendly(e)); return showResult('Order history import', lines); }
    lines.unshift('Imported ' + count + ' orders into the history. They are saved as Received, so they do not appear in the kitchen queue.');
    await loadHistory(true); showResult('Order history import', lines);
  }
  function template(kind){

  }

  document.addEventListener('click', function(e){

    if (a === 'adm-active') {
      var cur = state.users[id] && state.users[id].active === true;
      safe('act' + id, async function(){ await backend.send('PATCH', 'users/' + id, { active: !cur }); await loadUsers(); }, cur ? 'Access turned off' : 'Access turned on');
      return;
    }

    /* connection */
    if (a === 'conn-open') { fillConn(); state.connOpen = true; paint(); $('#connPanel').scrollIntoView({ block: 'nearest' }); return; }
    if (a === 'conn-close') { state.connOpen = false; if (state.role === 'admin' && state.adminTab === 'connection') state.adminTab = 'people'; paint(); return; }
    if (a === 'conn-copy') {
      var link = $('#cLink'); if (!link.value) { toast('Fill in the database URL and Web API key first.'); return; }
      link.select();
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(link.value).then(function(){ toast('Link copied'); }, function(){ toast('Press and hold the link to copy it.'); });
      else { try { document.execCommand('copy'); toast('Link copied'); } catch(x){ toast('Press and hold the link to copy it.'); } }
      return;
    }
    if (a === 'conn-test') {
      var rs = $('#cResult'); rs.textContent = 'Testing\u2026';
      testConn($('#cDb').value, $('#cKey').value).then(function(m){ rs.textContent = m; });
      return;
    }
    if (a === 'conn-save') {
      var d = $('#cDb').value.trim(), k = $('#cKey').value.trim();
      var nd = normDb(d); if (!nd.ok) { $('#cResult').textContent = nd.msg; return; }
      if (!k) { $('#cResult').textContent = 'Paste the Web API key.'; return; }
      try { localStorage.setItem('rb-cfg', JSON.stringify({ db: nd.url, key: k })); } catch(x){}
      location.href = shareLink(nd.url, k); return;
    }
    if (a === 'conn-demo') {
      try { localStorage.removeItem('rb-cfg'); localStorage.removeItem('rb-session'); localStorage.removeItem('rb-user'); } catch(x){}
      location.href = pageBase(); return;
    }

    /* shop + kitchen */
    if (a === 'send') {
      var ids = Object.keys(state.cart).filter(function(i){ return itemById(i); });
      if (!ids.length) return;
      var urg = state.urgency, note = state.note.trim(), n = ids.length;
      safe('order', async function(){
        for (var k2 = 0; k2 < ids.length; k2++) {
          var it = itemById(ids[k2]), rid = uid() + k2;
          var rec = { itemId: it.id, name: it.name, kind: it.kind || 'ingredient', unit: it.unit || 'pcs', qty: state.cart[ids[k2]],
                      urgency: urg, note: note, status: 'requested', by: state.me, createdAt: Date.now() + k2, updatedAt: Date.now() };
          seen[rid] = true;
          state.requests.unshift(Object.assign({}, rec, { id: rid }));
          await backend.send('PUT', 'requests/' + rid, rec);
          delete state.cart[ids[k2]];
        }
        state.note = '';
      }, 'Sent ' + n + (n === 1 ? ' item' : ' items') + ' to the kitchen').then(function(){ paint(); });
    } else if (a === 'status') {
      state.requests.forEach(function(r){ if (r.id === id) { r.status = b.dataset.to; r.updatedAt = Date.now(); } }); paint();
      safe('s' + id, function(){ return backend.send('PATCH', 'requests/' + id, { status: b.dataset.to, updatedAt: Date.now() }); });
    } else if (a === 'cancel') {
      state.requests = state.requests.filter(function(r){ return r.id !== id; }); paint();
      safe('s' + id, function(){ return backend.send('DELETE', 'requests/' + id); }, 'Request cancelled');
    } else if (a === 'remove-item') {
      state.items = state.items.filter(function(i){ return i.id !== id; }); delete state.cart[id]; paint();
      safe('i' + id, function(){ return backend.send('DELETE', 'items/' + id); }, 'Item removed');
    } else if (a === 'add-save') {
      var nm = $('#aName').value.trim(); if (!nm) { toast('Type a name first.'); return; }
      var item = { name: nm, kind: $('#aKind').value, unit: $('#aUnit').value.trim() || 'pcs' };
      var iid = slug(nm) + '-' + uid().slice(-4);
      state.items.push(Object.assign({}, item, { id: iid })); state.addOpen = false; paint();
      safe('add', function(){ return backend.send('PUT', 'items/' + iid, item); }, 'Item added');
    } else if (a === 'seed') {
      var all = {};
      STARTER.forEach(function(s){ var sid = slug(s[0]); all[sid] = { name: s[0], kind: s[1], unit: s[2] }; state.items.push(Object.assign({}, all[sid], { id: sid })); });
      paint();
      safe('seed', function(){ return backend.send('PATCH', 'items', all); }, 'Starter list added');
    }
  });

  async function init(){
    var c = cfg();
    state.mode = c ? 'cloud' : 'demo';
    backend = c ? makeCloud(c) : makeLocal();
    $('#lName').value = lastName();
    if (!c) {
      try {
        var du = JSON.parse(localStorage.getItem('rb-user') || 'null');
        if (du && du.name && ['shop','kitchen','admin'].indexOf(du.role) >= 0) enter({ uid:'demo', name:du.name, username:'', role:du.role });
      } catch(e){}
      paint(); return;
    }
    paint();
    try {
      if (await backend.restore()) {
        var p = await backend.getProfile(backend.uid()), msg = acceptProfile(backend.uid(), p);
        if (msg) { backend.signOut(); state.loginMsg = msg; }
      }
    } catch(e){
      if (/^(INVALID_REFRESH_TOKEN|TOKEN_EXPIRED|USER_NOT_FOUND|USER_DISABLED|MISSING_REFRESH_TOKEN)$/.test(e.code || '')) { backend.signOut(); state.loginMsg = 'Please sign in again.'; }
      else state.loginMsg = 'Can\u2019t reach the database right now. Check the internet connection, then reload the page.';
    }
    paint();
  }
  setInterval(function(){ if (state.user) paint(); }, 60000);
  init();
})();
</script>
</body>
</html>
